name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release anlegen, z. B. 0.8.0 (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inventur.exe bauen
        shell: powershell
        run: .\build.ps1

      - name: Inventur-Skript testen (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'Inventur_CI.md'
          .\Invoke-Inventur.ps1 -Kunde 'CI-Test & Co' -Techniker 'GitHub Actions' -OutputPath $report
          if (-not (Test-Path $report)) { throw 'Kein Report erzeugt.' }
          $text = Get-Content $report -Encoding UTF8
          $text | Where-Object { $_ -match 'Nicht verf' } | ForEach-Object { Write-Host "::warning::$_" }
          Write-Host '----- Report -----'
          $text | ForEach-Object { Write-Host $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: Inventur
          path: |
            dist/Inventur.exe
            ${{ runner.temp }}/Inventur_CI.md

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = 'v' + $env:RELEASE_INPUT.Trim().TrimStart('v') }
          $line = Select-String -Path .\Invoke-Inventur.ps1 -Pattern "^\`$ScriptVersion = '(.+)'" | Select-Object -First 1
          $scriptVersion = $line.Matches[0].Groups[1].Value
          if ($tag -ne "v$scriptVersion") { throw "Tag $tag passt nicht zur Skriptversion $scriptVersion." }
          gh release create $tag dist/Inventur.exe --target $env:GITHUB_SHA --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release fehlgeschlagen.' }
