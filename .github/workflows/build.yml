name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release anlegen, z. B. 0.8.0 (leer = nur bauen)'
        required: false
        default: ''

# Nur lesen; Schreibrechte bekommt allein der Release-Job.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inventur.exe bauen
        shell: powershell
        run: .\build.ps1

      - name: Inventur-Skript testen (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'Inventur_CI.md'
          .\Invoke-Inventur.ps1 -Kunde 'CI-Test & Co' -Station 'Empfang 1' -Techniker 'GitHub Actions' -OutputPath $report
          if (-not (Test-Path $report)) { throw 'Kein Report erzeugt.' }
          $text = Get-Content $report -Encoding UTF8
          $text | Where-Object { $_ -match 'Nicht verf' } | ForEach-Object { Write-Host "::warning::$_" }
          Write-Host '----- Report -----'
          $text | ForEach-Object { Write-Host $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: Inventur
          path: |
            dist/Inventur.exe
            ${{ runner.temp }}/Inventur_CI.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Inventur
          path: artifact

      - name: Release anlegen
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = 'v' + $env:RELEASE_INPUT.Trim().TrimStart('v') }
          # build.ps1 setzt die Exe-Version aus $ScriptVersion
          $exe = Get-ChildItem artifact -Recurse -Filter Inventur.exe | Select-Object -First 1
          $version = ([version]$exe.VersionInfo.FileVersion).ToString(3)
          if ($tag -ne "v$version") { throw "Tag $tag passt nicht zur Version $version der Exe." }
          gh release create $tag $exe.FullName --target $env:GITHUB_SHA --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release fehlgeschlagen.' }
